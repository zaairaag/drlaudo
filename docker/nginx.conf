# Cache policy lives at server scope so location blocks inherit every security
# header. Missing assets and all HTML/API/error responses remain non-cacheable.
map "$status:$uri" $drlaudo_cache_control {
  default "no-store";
  ~^(200|304):/assets/ "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  # Relative redirect preserves the host port (e.g. localhost:8080).
  location = /api {
    return 308 /api/$is_args$args;
  }

  # Strip exactly one /api prefix. Unknown API paths must never reach the SPA.
  location ^~ /api/ {
    proxy_pass http://api:3333/;
    proxy_http_version 1.1;
    # Let the API reject forbidden bodies before a client finishes uploading.
    proxy_request_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # This is the sole trusted hop. Do not append client-supplied forwarding data.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header Forwarded "";
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    proxy_redirect off;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header Cache-Control $drlaudo_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  # Radix Popper/Dialog use style attributes; react-remove-scroll injects style
  # elements through react-style-singleton. Only styles need inline permission.
  # Fonts stay as files: the web build never inlines a woff2 as data:, which
  # this directive would block.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
}
